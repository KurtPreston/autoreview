name: Autoreview
description: Two Copilot CLI agents deliberate a pull request. One reviews; the other fixes, replies or defers to the author.

inputs:
  copilot-token:
    description: >-
      A GitHub token the Copilot CLI may use. On GitHub, the workflow's own token works when the
      job has the copilot-requests permission, billing the organization; on Gitea, pass a GitHub
      token with the "Copilot Requests" permission.
    default: ${{ github.token }}
  reviewer-token:
    description: Token of the reviewer bot account. With fixer-token, each role posts as its own user.
    default: ""
  fixer-token:
    description: Token of the fixer bot account, which also pushes fixes.
    default: ""
  token:
    description: Fallback token when the bot tokens are absent; both roles then post as one identity.
    default: ${{ github.token }}
  pr:
    description: The pull request to deliberate.
    default: ${{ github.event.pull_request.number }}
  heavy:
    description: Also run the config's heavyChecks, on a runner that can afford them.
    default: "false"
  copilot-version:
    description: The @github/copilot npm package version to install.
    default: latest

runs:
  using: composite
  steps:
    # Node runs the tool (with type stripping) and the Copilot CLI
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    # Install the Copilot CLI; it reads instructions from COPILOT_HOME, which earlier steps may set.
    # Install it into the job's own temp directory, not globally: a runner's tool cache is shared
    # by concurrent jobs, and one job reinstalling it there unlinks `copilot` under another.
    - name: Set up the Copilot CLI
      shell: bash
      env:
        COPILOT_VERSION: ${{ inputs.copilot-version }}
      run: |
        prefix="${RUNNER_TEMP:-/tmp}/autoreview-copilot"
        npm install --prefix "$prefix" --no-save --no-package-lock --no-fund --no-audit "@github/copilot@$COPILOT_VERSION"
        echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"

    # Let the posting identity fetch and push, and sign commits as it
    - name: Set up git
      shell: bash
      env:
        PUSH_TOKEN: ${{ inputs.fixer-token || inputs.token }}
      run: '"$GITHUB_ACTION_PATH/setup-git.sh"'

    # Deliberate; the tool skips pull requests without either label, and its own pushes
    - name: Deliberate
      shell: bash
      env:
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-token }}
        AUTOREVIEW_REVIEWER_TOKEN: ${{ inputs.reviewer-token }}
        AUTOREVIEW_FIXER_TOKEN: ${{ inputs.fixer-token }}
        GITEA_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
        AUTOREVIEW_EVENT: ${{ github.event.action }}
        PR: ${{ inputs.pr }}
        HEAVY: ${{ inputs.heavy }}
      run: |
        # Run a copy, since a vendored action lives in the checkout the run moves to the head
        tool="$RUNNER_TEMP/autoreview-tool"
        rm -rf "$tool" && mkdir -p "$tool"
        cp -R "$GITHUB_ACTION_PATH/src" "$GITHUB_ACTION_PATH/prompts" "$GITHUB_ACTION_PATH/package.json" "$tool/"

        args=(run --pr "$PR" --checkout "$GITHUB_WORKSPACE")
        if [[ "$HEAVY" == "true" ]]; then args+=(--heavy); fi
        # exec, so the runner's cancellation signals reach node rather than stopping only bash
        exec node --use-system-ca "$tool/src/autoreview.ts" "${args[@]}"
