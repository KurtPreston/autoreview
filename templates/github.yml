# Autoreview: agents deliberate pull requests. The "autoreview" label runs a reviewer, and
# "autofix" a fixer that fixes, replies or defers to the author. Added by autoreview's add.sh.
# It posts and pushes as github-actions[bot], with the Copilot CLI billed to the organization.
name: Autoreview

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
  # Another bot or person reviewed; reviews posted with the workflow's token start no runs
  pull_request_review:
    types: [submitted]

# Push fixes, post reviews and labels, start checks after a fix, and call the Copilot CLI
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  copilot-requests: write

# One run per pull request at a time; a newer one waits rather than cancelling
concurrency:
  group: autoreview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  autoreview:
    # Skip drafts, and forks, whose heads the workflow's token can't push to
    if: >-
      (contains(github.event.pull_request.labels.*.name, 'autoreview') ||
        contains(github.event.pull_request.labels.*.name, 'autofix')) &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {{runsOn}}
    timeout-minutes: 120
    steps:
      # The whole history, so a review can diff against the last one
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
{{setup}}{{setupActions}}
      # Deliberate: review, fix and reply, and defer what's for the author
      - uses: {{uses}}
        with:
          # The workflow's own token, unless a COPILOT_GITHUB_TOKEN secret holds a token with
          # the "Copilot Requests" permission, for accounts whose Copilot policy refuses it
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
