# Autoreview: agents deliberate pull requests. The "autoreview" label runs a reviewer, and
# "autofix" a fixer that fixes, replies or defers to the author. Added by autoreview's add.sh.
name: Autoreview

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]

# One run per pull request at a time; a newer one waits rather than cancelling
concurrency:
  group: autoreview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  autoreview:
    if: >-
      (contains(github.event.pull_request.labels.*.name, 'autoreview') ||
        contains(github.event.pull_request.labels.*.name, 'autofix')) &&
      !github.event.pull_request.draft
    runs-on: {{runsOn}}
    timeout-minutes: 120
    steps:
      # The whole history, so a review can diff against the last one
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
{{setup}}{{setupActions}}
      # Deliberate: review, fix and reply, and defer what's for the author
      - uses: {{uses}}
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          reviewer-token: ${{ secrets.AUTOREVIEW_REVIEWER_TOKEN }}
          fixer-token: ${{ secrets.AUTOREVIEW_FIXER_TOKEN }}
