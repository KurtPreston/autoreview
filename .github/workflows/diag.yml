# Throwaway: which Copilot CLI calls the built-in token may make.
name: Diag
on: pull_request
permissions:
  contents: read
  copilot-requests: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @github/copilot && copilot --version
      - run: |
          for model in default gpt-6-astra claude-opus-5.5; do
            echo "== $model"
            flags=(); [[ $model != default ]] && flags=(--model "$model")
            copilot -p "Reply with the word ok" -s "${flags[@]}" 2>&1 | tail -3 || true
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          echo "== COPILOT_GITHUB_TOKEN"
          copilot -p "Reply with the word ok" -s 2>&1 | tail -3 || true
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
