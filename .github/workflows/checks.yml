name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Fetch the code and a Node that strips TypeScript types
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install exactly what the lockfile pins
      - run: npm ci

      # Types, lint and formatting, then whole deliberations against a scratch git repository
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
